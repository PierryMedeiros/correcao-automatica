name: banca-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: banca
      POSTGRES_PASSWORD: banca
      POSTGRES_DB: banca
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banca -d banca']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
